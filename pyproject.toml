[project]
name = "egridcast"
version = "0.1.0"
description = "VIC1 hourly electricity-demand forecasting dashboard"
readme = "README.md"
authors = [
    { name = "Behzad", email = "b.moradi@student.unimelb.edu.au" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "jupyter>=1.1.1",
    "lightning>=2.6.6",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "statsforecast>=2.0.1",
    "statsmodels>=0.15.0",
    "torch>=2.14.0",
    "torchviz>=0.0.3",
    "utilsforecast>=0.2.15",
    "xgboost>=3.2.0",
]

[project.scripts]
egridcast = "egridcast:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11", "httpx>=0.28"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
